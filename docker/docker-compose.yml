services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: local-clickhouse
    ports:
      - "8123:8123" # HTTP Port
      - "9000:9000" # Native Client Port
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "password", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ch_data: